<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#FDF0D5" />
		<meta name="description" content="Rondje — a multiplayer memory game for practising Dutch vocabulary." />
		<script>
			// Apply the colour theme before first paint (kept in sync with $lib/client/theme.svelte.ts).
			(function () {
				var theme;
				try {
					theme = localStorage.getItem('rondje-theme');
				} catch (e) {}
				if (theme !== 'light' && theme !== 'dark') {
					theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
				}
				document.documentElement.dataset.theme = theme;
				if (theme === 'dark') document.querySelector('meta[name="theme-color"]').content = '#0D1F1C';
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
